site_name: "@twobots/ui-theme"
site_description: Shared visual material for the twobots.dev card-game lineup — design tokens, card rendering, table chrome, overlay/rail/match-over shells
# Served under BOTH docs.twobots.dev/otso/ and docs.bjornbasar.com/otso/ from the same
# container. The canonical must be the PUBLIC one: docs.bjornbasar.com sits behind Cloudflare
# Access, so pointing search engines there would name a URL they can never fetch.
#
# The trailing path segment is load-bearing — mkdocs-material builds the canonical link and the
# sitemap from this value, and a bare host here would advertise every page at the site root.
site_url: https://docs.twobots.dev/otso/
repo_url: https://github.com/bjornbasar/otso
repo_name: bjornbasar/otso
copyright: MIT licensed

theme:
  name: material
  # overrides/main.html adds a root-relative "All documentation" link to every page.
  # Root-relative on purpose — these sites answer under two hostnames. See that file.
  custom_dir: overrides
  # Deep orange/amber is karhu's; teal/cyan is datvi's. A third pair so the three reference
  # sites are distinguishable at a glance when several are open under one docs host.
  palette:
    - scheme: slate
      primary: indigo
      accent: pink
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: pink
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - content.code.annotate
    - search.highlight
    - search.suggest
    - toc.follow

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Stylesheets: styles.md
  - API Reference:
    - card: api/card.md
    - rail: api/rail.md
    - match-over: api/match-over.md

# Turn link and anchor problems into warnings, which `--strict` then turns into a failed
# build. Without this, a cross-reference to a renamed heading is only an INFO message and
# ships broken. ci/deploy.sh runs `build --strict`.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/bjornbasar/otso
    - icon: fontawesome/brands/npm
      link: https://www.npmjs.com/package/@twobots/ui-theme
